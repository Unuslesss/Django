{% extends 'lect1/base.html' %}
{% block content %}
<h1>Группа {{ group.name }}</h1>
<p>Курс: {{ group.course }}</p>
<p>Год набора: {{ group.study_year }}</p>
<p>Номер группы: {{ group.number }}</p>
<p>Факультет: {{ group.faculty }}</p>
<a href="{% url 'university:group_list' %}">Вернуться к списку групп</a>
<a href="{% url 'university:group_update' group.pk %}">Редактировать</a>
<a href="{% url 'university:group_delete' group.pk %}">Удалить</a>
{% endblock %}
