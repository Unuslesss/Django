{% extends 'lect1/base.html' %}
{% block content %}
<h1>{% if form.instance.pk %}Редактировать группу{% else %}Добавить новую группу{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'university:group_list' %}">Вернуться к списку групп</a>
{% endblock %}
